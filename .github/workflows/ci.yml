name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # codecov-action use_oidc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - run: go build ./...
      - run: go vet ./...
      - run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          use_oidc: true
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # NilAway is only available as a golangci-lint module plugin, so build a
      # custom binary (see .custom-gcl.yml) instead of running the stock one.
      # Keep this version in sync with .custom-gcl.yml.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - run: $(go env GOPATH)/bin/golangci-lint custom
      - run: ./custom-gcl run ./...
