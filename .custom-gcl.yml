# Builds a golangci-lint binary with the NilAway module plugin
# (`golangci-lint custom`); run it as ./custom-gcl.
version: v2.14.0
name: custom-gcl
destination: .
plugins:
  - module: go.uber.org/nilaway
    import: go.uber.org/nilaway/cmd/gclplugin
    version: acb8859b9031bb9496be97e027df5573f9fb5340
